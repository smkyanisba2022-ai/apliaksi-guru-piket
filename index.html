<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Aplikasi Jurnal Piket Sekolah</title>

  <!-- PWA MANIFEST & LOGO APLIKASI -->
  <link rel="manifest" href="./manifest.json">
  <link rel="icon" type="image/png" href="./logo.png">
  <link rel="apple-touch-icon" href="./logo.png">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#4f46e5">

  <!-- Tailwind CSS & FontAwesome CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-slate-100 font-sans min-h-screen pb-12">
  <!-- HEADER & NAVBAR -->
  <header class="bg-indigo-900 text-white shadow-md sticky top-0 z-50">
    <div class="max-w-md mx-auto px-4 py-3 flex justify-between items-center">
      <div>
        <h1 class="font-bold text-sm tracking-wide">JURNAL PIKET SEKOLAH</h1>
        <p id="clockDisplay" class="text-[10px] text-indigo-200 mt-0.5">Memuat waktu...</p>
      </div>
      <div id="statusKoneksi" class="px-2.5 py-1 text-[10px] rounded-full bg-slate-700 text-white font-semibold flex items-center gap-1 shadow-sm">
        <i class="fa-solid fa-spinner animate-spin"></i> Cek Koneksi...
      </div>
    </div>
  </header>

  <main class="max-w-md mx-auto px-4 pt-4 space-y-4">

    <!-- INPUT PETUGAS PIKET -->
    <div class="bg-white p-3.5 rounded-xl shadow-sm border border-slate-200">
      <label class="block text-xs font-bold text-slate-700 mb-1">
        <i class="fa-solid fa-user-shield text-indigo-600 mr-1"></i> Nama Petugas Piket:
      </label>
      <input type="text" id="petugasPiket" placeholder="Masukkan nama petugas..." class="w-full text-xs p-2.5 bg-slate-50 border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:bg-white transition-all">
    </div>

    <!-- PANEL OFFLINE QUEUE (ATAS) -->
    <div id="panelOffline" class="bg-amber-50 border border-amber-200 rounded-xl p-3 shadow-sm hidden transition-all">
      <div class="flex justify-between items-center mb-2 cursor-pointer" onclick="toggleOfflinePanel()">
        <div class="flex items-center gap-2">
          <span class="w-6 h-6 rounded-lg bg-amber-500 text-white flex items-center justify-center font-bold text-xs" id="offlineCount">0</span>
          <h3 class="font-bold text-xs text-amber-900">Catatan Offline Belum Diunggah</h3>
        </div>
        <i id="iconMinimize" class="fa-solid fa-chevron-down text-xs text-amber-700 transition-transform"></i>
      </div>

      <div id="offlineBody" class="space-y-2 mb-3">
        <!-- Item antrean offline dirender via JS -->
      </div>

      <!-- Tombol Upload Offline -->
      <button id="btnSyncOffline" type="button" onclick="syncOfflineData(event)" class="w-full bg-emerald-600 hover:bg-emerald-700 active:scale-[0.98] text-white py-2 px-3 rounded-lg text-xs font-semibold flex items-center justify-center gap-2 transition-all shadow-sm">
        <svg id="spinnerOffline" class="animate-spin h-4 w-4 text-white hidden" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
          <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
          <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
        </svg>
        <i id="iconOffline" class="fa-solid fa-cloud-arrow-up"></i>
        <span id="labelOffline">Upload Semua ke Spreadsheet</span>
      </button>
    </div>

   <!-- NAVIGASI TAB (STICKY ON SCROLL) -->
    <div class="sticky top-[53px] z-40 bg-slate-100/90 backdrop-blur-sm pt-2 pb-1">
      <div class="bg-slate-200 p-1 rounded-xl flex text-xs font-medium gap-1 shadow-sm">
        <button id="tabBtnGuru" onclick="switchTab(event, 'guru')" class="flex-1 py-2 text-center font-semibold rounded-lg bg-indigo-600 text-white shadow cursor-pointer transition-all">
          Laporan Guru
        </button>
        <button id="tabBtnSiswa" onclick="switchTab(event, 'siswa')" class="flex-1 py-2 text-center font-semibold rounded-lg text-slate-600 hover:bg-slate-300 cursor-pointer transition-all">
          Laporan Siswa
        </button>
        <button id="tabBtnPantau" onclick="switchTab(event, 'pantau')" class="flex-1 py-2 text-center font-semibold rounded-lg text-slate-600 hover:bg-slate-300 cursor-pointer transition-all">
          Rekapitulasi
        </button>
      </div>
    </div>

    <!-- FORM 1: LAPORAN GURU -->
    <form id="formGuru" onsubmit="handleSubmitedGuru(event)" class="bg-white p-4 rounded-xl shadow-sm border border-slate-200 space-y-3">
      <div class="flex justify-between items-center border-b pb-2 border-slate-100">
        <h2 class="font-bold text-xs text-indigo-900 flex items-center gap-1.5">
          <i class="fa-solid fa-chalkboard-user text-indigo-600"></i> Form Kehadiran Guru
        </h2>
        <span id="statusLoadGuru" class="text-[10px] text-slate-400 font-mono">[Loading...]</span>
      </div>

      <div>
        <label class="block text-[11px] font-semibold text-slate-600 mb-1">Nama Guru</label>
        <select id="selectGuru" onchange="onGuruSelectChanged()" class="w-full text-xs p-2.5 bg-slate-50 border border-slate-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:bg-white">
          <option value="">-- Pilih Nama Guru --</option>
        </select>
      </div>

      <div>
        <label class="block text-[11px] font-semibold text-slate-600 mb-1">Mata Pelajaran</label>
        <select id="selectGuruMapel" class="w-full text-xs p-2.5 bg-slate-50 border border-slate-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:bg-white">
          <option value="">-- Pilih Guru Terlebih Dahulu --</option>
        </select>
      </div>

      <div class="grid grid-cols-2 gap-2">
        <div>
          <label class="block text-[11px] font-semibold text-slate-600 mb-1">Jam Ke-</label>
          <select id="guruJamKe" class="w-full text-xs p-2.5 bg-slate-50 border border-slate-300 rounded-lg focus:ring-2 focus:ring-indigo-500">
            <!-- Populated by JS -->
          </select>
        </div>
        <div>
          <label class="block text-[11px] font-semibold text-slate-600 mb-1">Jam Masuk Kelas</label>
          <input type="time" id="guruJamMasuk" class="w-full text-xs p-2.5 bg-slate-50 border border-slate-300 rounded-lg focus:ring-2 focus:ring-indigo-500">
        </div>
      </div>

      <div>
        <label class="block text-[11px] font-semibold text-slate-600 mb-1">Status Kehadiran</label>
        <select id="guruStatus" class="w-full text-xs p-2.5 bg-slate-50 border border-slate-300 rounded-lg focus:ring-2 focus:ring-indigo-500">
          <option value="Hadir">Hadir</option>
          <option value="Hadir Terlambat">Hadir Terlambat</option>
          <option value="Izin">Izin</option>
          <option value="Sakit">Sakit</option>
          <option value="Dinas Keluar">Dinas Keluar</option>
          <option value="Tanpa Keterangan">Tanpa Keterangan</option>
        </select>
      </div>

      <div>
        <label class="block text-[11px] font-semibold text-slate-600 mb-1">Tugas / Catatan Materi</label>
        <textarea id="guruTugas" rows="2" placeholder="Tuliskan materi/tugas jika guru berhalangan..." class="w-full text-xs p-2.5 bg-slate-50 border border-slate-300 rounded-lg focus:ring-2 focus:ring-indigo-500"></textarea>
      </div>

      <!-- Tombol Form Guru -->
      <div class="flex gap-2 pt-2">
        <button id="btnSubmitGuru" type="submit" class="flex-1 bg-indigo-600 hover:bg-indigo-700 active:scale-[0.98] text-white py-2.5 rounded-lg text-xs font-semibold flex items-center justify-center gap-2 transition-all shadow-sm">
          <svg id="spinnerGuru" class="animate-spin h-4 w-4 text-white hidden" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
            <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
            <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
          </svg>
          <i id="iconGuru" class="fa-solid fa-paper-plane"></i>
          <span id="labelGuru">Kirim Laporan</span>
        </button>
        <button type="button" onclick="simpanGuruOffline()" class="px-3 bg-slate-100 hover:bg-slate-200 text-slate-700 rounded-lg text-xs font-semibold transition-colors">
          Catat Offline
        </button>
      </div>
    </form>

    <!-- FORM 2: LAPORAN SISWA -->
    <form id="formSiswa" onsubmit="handleSubmitedSiswa(event)" class="bg-white p-4 rounded-xl shadow-sm border border-slate-200 space-y-3 hidden">
      <div class="flex justify-between items-center border-b pb-2 border-slate-100">
        <h2 class="font-bold text-xs text-emerald-900 flex items-center gap-1.5">
          <i class="fa-solid fa-user-graduate text-emerald-600"></i> Form Izin / Perizinan Siswa
        </h2>
        <span id="statusLoadSiswa" class="text-[10px] text-slate-400 font-mono">[Loading...]</span>
      </div>

      <div>
        <label class="block text-[11px] font-semibold text-slate-600 mb-1">Nama Siswa & Kelas</label>
        <select id="selectSiswa" class="w-full text-xs p-2.5 bg-slate-50 border border-slate-300 rounded-lg focus:ring-2 focus:ring-emerald-500 focus:bg-white">
          <option value="">-- Pilih Nama Siswa --</option>
        </select>
      </div>

      <div>
        <label class="block text-[11px] font-semibold text-slate-600 mb-1">Jam Ke-</label>
        <select id="siswaJamKe" class="w-full text-xs p-2.5 bg-slate-50 border border-slate-300 rounded-lg focus:ring-2 focus:ring-emerald-500">
          <!-- Populated by JS -->
        </select>
      </div>

      <div>
        <label class="block text-[11px] font-semibold text-slate-600 mb-1">Keterangan / Alasan</label>
        <select id="siswaStatus" class="w-full text-xs p-2.5 bg-slate-50 border border-slate-300 rounded-lg focus:ring-2 focus:ring-emerald-500">
          <option value="Izin Meninggalkan Sekolah">Izin Meninggalkan Sekolah</option>
          <option value="Izin Pulang Karena Sakit">Izin Pulang Karena Sakit</option>
          <option value="Izin Keterlambatan Masuk">Izin Keterlambatan Masuk</option>
          <option value="Dispensasi Kegiatan Sekolah">Dispensasi Kegiatan Sekolah</option>
        </select>
      </div>

      <!-- Tombol Form Siswa -->
      <div class="flex gap-2 pt-2">
        <button id="btnSubmitSiswa" type="submit" class="flex-1 bg-emerald-600 hover:bg-emerald-700 active:scale-[0.98] text-white py-2.5 rounded-lg text-xs font-semibold flex items-center justify-center gap-2 transition-all shadow-sm">
          <svg id="spinnerSiswa" class="animate-spin h-4 w-4 text-white hidden" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
            <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
            <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
          </svg>
          <i id="iconSiswa" class="fa-solid fa-paper-plane"></i>
          <span id="labelSiswa">Kirim Laporan</span>
        </button>
        <button type="button" onclick="simpanSiswaOffline()" class="px-3 bg-slate-100 hover:bg-slate-200 text-slate-700 rounded-lg text-xs font-semibold transition-colors">
          Catat Offline
        </button>
      </div>
    </form>

    <!-- TAB 3: PANTAU / REKAPITULASI -->
    <div id="sectionPantau" class="hidden">
      <div id="tabelLaporanContainer" class="space-y-4">
        <!-- Rekapitulasi dirender via JS -->
      </div>
    </div>

  </main>

  <script src="app.js"></script>
</body>
</html>
