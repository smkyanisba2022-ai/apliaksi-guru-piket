<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>E-Piket Guru Sekolah</title>
    
    <meta name="theme-color" content="#0f172a">
    
    <!-- CSS Bootstrap 5 & FontAwesome -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    
    <style>
        body { 
            background-color: #f8fafc; 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; 
            padding-bottom: 40px; 
        }
        .navbar-custom { 
            background: #0f172a; 
            color: white; 
            border-radius: 0 0 20px 20px; 
            box-shadow: 0 4px 10px rgba(0,0,0,0.15); 
        }
        .card-custom { 
            border-radius: 16px; 
            border: 1px solid #e2e8f0; 
            box-shadow: 0 4px 15px rgba(0,0,0,0.03); 
            margin-bottom: 20px; 
        }
        .btn-round { 
            border-radius: 50px; 
            font-weight: 700; 
            padding: 12px 20px; 
        }
    </style>
</head>
<body>

    <!-- NAVBAR ATAS & INDIKATOR KONEKSI -->
    <nav class="navbar navbar-custom p-3 mb-4">
        <div class="container-fluid d-flex justify-content-between align-items-center">
            <span class="fw-bold fs-5"><i class="fa-solid fa-clipboard-user me-2"></i>E-Piket Mobile</span>
            <span id="status-koneksi" class="badge bg-danger"><i class="fa-solid fa-wifi"></i> Offline</span>
        </div>
    </nav>

    <div class="container" style="max-width: 600px;">

        <!-- BOKS INFO PETUGAS, TANGGAL & SYNC MASTER -->
        <div class="card card-custom p-3 bg-white">
            <div class="row g-2 mb-2">
                <div class="col-7">
                    <label class="text-muted small fw-bold">Petugas Piket:</label>
                    <input type="text" id="nama-petugas" class="form-control form-control-sm fw-bold" placeholder="Nama Anda...">
                </div>
                <div class="col-5">
                    <label class="text-muted small fw-bold">Tanggal:</label>
                    <input type="date" id="tgl-piket" class="form-control form-control-sm bg-light" readonly>
                </div>
            </div>
            <button onclick="downloadMasterData()" class="btn btn-outline-primary btn-sm rounded-pill w-100 mt-1">
                <i class="fa-solid fa-rotate me-1"></i> Sync Master Data (Siswa & Guru)
            </button>
        </div>

        <!-- 1. FORM INPUT ABSEN SISWA -->
        <div class="card card-custom p-4 bg-white">
            <h6 class="fw-bold text-primary mb-3"><i class="fa-solid fa-user-graduate me-2"></i>1. Catat Siswa Bermasalah</h6>
            
            <div class="mb-2">
                <label class="form-label text-muted small">Cari Nama Siswa:</label>
                <input list="list-siswa" id="input-siswa" class="form-control" placeholder="Ketik nama / kelas siswa...">
                <datalist id="list-siswa"></datalist>
            </div>

            <!-- Jam Ke- & Status Siswa -->
            <div class="row g-2 mb-3">
                <div class="col-6">
                    <label class="form-label text-muted small">Pada Jam Ke-:</label>
                    <select id="jam-siswa" class="form-select">
                        <option value="Jam ke 1">Jam ke 1</option>
                        <option value="Jam ke 2">Jam ke 2</option>
                        <option value="Jam ke 3">Jam ke 3</option>
                        <option value="Jam ke 4">Jam ke 4</option>
                        <option value="Jam ke 5">Jam ke 5</option>
                        <option value="Jam ke 6">Jam ke 6</option>
                        <option value="Jam ke 7">Jam ke 7</option>
                        <option value="Jam ke 8">Jam ke 8</option>
                    </select>
                </div>
                <div class="col-6">
                    <label class="form-label text-muted small">Keterangan:</label>
                    <select id="status-siswa" class="form-select">
                        <option value="Alpa">Alpa</option>
                        <option value="Izin">Izin</option>
                        <option value="Sakit">Sakit</option>
                        <option value="Terlambat">Terlambat</option>
                    </select>
                </div>
            </div>

            <button onclick="tambahSiswa()" class="btn btn-primary w-100"><i class="fa-solid fa-plus me-1"></i> Tambah Siswa</button>

            <!-- List Sementara Siswa -->
            <ul id="daftar-siswa-temp" class="list-group list-group-flush border-top mt-3"></ul>
        </div>

        <!-- 2. FORM INPUT PEMANTAUAN KELAS / KETEPATAN GURU -->
        <div class="card card-custom p-4 bg-white">
            <h6 class="fw-bold text-danger mb-3"><i class="fa-solid fa-chalkboard-user me-2"></i>2. Pemantauan Jam / Kehadiran Guru</h6>
            
            <div class="mb-2">
                <label class="form-label text-muted small">Cari Nama Guru:</label>
                <input list="list-guru" id="input-guru" class="form-control" placeholder="Ketik nama / mapel guru...">
                <datalist id="list-guru"></datalist>
            </div>

            <div class="row g-2 mb-2">
                <div class="col-6">
                    <label class="form-label text-muted small">Jam Pelajaran:</label>
                    <select id="jam-guru" class="form-select">
                        <option value="Jam ke 1">Jam ke 1</option>
                        <option value="Jam ke 2">Jam ke 2</option>
                        <option value="Jam ke 3">Jam ke 3</option>
                        <option value="Jam ke 4">Jam ke 4</option>
                        <option value="Jam ke 5">Jam ke 5</option>
                        <option value="Jam ke 6">Jam ke 6</option>
                        <option value="Jam ke 7">Jam ke 7</option>
                        <option value="Jam ke 8">Jam ke 8</option>
                    </select>
                </div>
                <div class="col-6">
                    <label class="form-label text-muted small">Jam Masuk Kelas (Manual):</label>
                    <!-- Input jam manual -->
                    <input type="time" id="waktu-masuk-guru" class="form-control">
                </div>
            </div>

            <div class="mb-2">
                <label class="form-label text-muted small">Status Kehadiran:</label>
                <select id="status-guru" class="form-select">
                    <option value="Hadir Tepat Waktu">Hadir Tepat Waktu</option>
                    <option value="Hadir Terlambat">Hadir Terlambat</option>
                    <option value="Izin">Izin</option>
                    <option value="Sakit">Sakit</option>
                    <option value="Tanpa Keterangan (Kosong)">Tanpa Keterangan (Kosong)</option>
                </select>
            </div>

            <div class="mb-3">
                <label class="form-label text-muted small">Catatan / Materi / Tugas yang Ditinggalkan:</label>
                <textarea id="tugas-guru" class="form-control" rows="2" placeholder="Contoh: Terlambat 15 menit / Memberi tugas LKS Hal 20..."></textarea>
            </div>

            <button onclick="tambahGuru()" class="btn btn-danger w-100"><i class="fa-solid fa-plus me-1"></i> Tambah Catatan Guru</button>

            <!-- List Sementara Guru -->
            <ul id="daftar-guru-temp" class="list-group list-group-flush border-top mt-3"></ul>
        </div>

        <!-- TOMBOL SIMPAN LOKAL & UPLOAD -->
        <div class="d-grid gap-2 mt-4">
            <button onclick="simpanLokal()" class="btn btn-secondary btn-round"><i class="fa-solid fa-floppy-disk me-2"></i>Simpan Draf di HP (Offline)</button>
            <button onclick="uploadKePusat()" class="btn btn-success btn-round"><i class="fa-solid fa-cloud-arrow-up me-2"></i>Upload Laporan ke Pusat (Online)</button>
        </div>

    </div>

    <script>
        const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxR_LxFxTgDvxF_f3ahzFxCsvsLkhDKvnMXhpYtHks6tOVCHxxtx-q3NsqmluRYIhK2/exec";

        let tempSiswa = [];
        let tempGuru = [];

        // Set Tanggal Otomatis Hari Ini
        document.getElementById('tgl-piket').value = new Date().toISOString().split('T')[0];

        // Set Default Jam Masuk Manual ke Waktu Sekarang (Format HH:MM)
        const skrg = new Date();
        const jamStr = String(skrg.getHours()).padStart(2, '0') + ':' + String(skrg.getMinutes()).padStart(2, '0');
        document.getElementById('waktu-masuk-guru').value = jamStr;

        // DETEKSI KONEKSI
        window.addEventListener('online', updateStatusKoneksi);
        window.addEventListener('offline', updateStatusKoneksi);

        function updateStatusKoneksi() {
            const badge = document.getElementById('status-koneksi');
            if (navigator.onLine) {
                badge.className = "badge bg-success";
                badge.innerHTML = '<i class="fa-solid fa-wifi"></i> Online';
            } else {
                badge.className = "badge bg-danger";
                badge.innerHTML = '<i class="fa-solid fa-wifi"></i> Offline';
            }
        }

        // SYNC MASTER DATA
        async function downloadMasterData() {
            if (!navigator.onLine) return alert("Harus terhubung ke internet untuk Sync Data!");
            try {
                const res = await fetch(`${SCRIPT_URL}?action=get_master`);
                const data = await res.json();
                
                localStorage.setItem('master_siswa', JSON.stringify(data.siswa));
                localStorage.setItem('master_guru', JSON.stringify(data.guru));
                
                loadDatalist();
                alert("Master Data berhasil diperbarui di HP!");
            } catch (err) {
                alert("Gagal mengunduh master data.");
            }
        }

        function loadDatalist() {
            const siswa = JSON.parse(localStorage.getItem('master_siswa') || '[]');
            const guru = JSON.parse(localStorage.getItem('master_guru') || '[]');

            document.getElementById('list-siswa').innerHTML = siswa.map(s => `<option value="${s.nama} (${s.kelas})">`).join('');
            document.getElementById('list-guru').innerHTML = guru.map(g => `<option value="${g.nama} (${g.mapel})">`).join('');
        }

        // TAMBAH SISWA SEMENTARA
        function tambahSiswa() {
            const nama = document.getElementById('input-siswa').value;
            const jam = document.getElementById('jam-siswa').value;
            const status = document.getElementById('status-siswa').value;
            
            if(!nama) return alert("Pilih nama siswa terlebih dahulu");

            tempSiswa.push({ nama, jam, status });
            document.getElementById('input-siswa').value = '';
            renderTempList();
        }

        // TAMBAH GURU SEMENTARA
        function tambahGuru() {
            const nama = document.getElementById('input-guru').value;
            const jam = document.getElementById('jam-guru').value;
            const waktuMasuk = document.getElementById('waktu-masuk-guru').value;
            const status = document.getElementById('status-guru').value;
            const tugas = document.getElementById('tugas-guru').value;
            
            if(!nama) return alert("Pilih nama guru terlebih dahulu");

            tempGuru.push({ nama, jam, waktuMasuk, status, tugas });
            document.getElementById('input-guru').value = '';
            document.getElementById('tugas-guru').value = '';
            renderTempList();
        }

        // RENDER LIST SEMENTARA
        function renderTempList() {
            document.getElementById('daftar-siswa-temp').innerHTML = tempSiswa.map((s) => 
                `<li class="list-group-item d-flex justify-content-between align-items-center small py-2">
                    <div><b>${s.nama}</b> <br><small class="text-muted">${s.jam}</small></div>
                    <span class="badge bg-warning text-dark">${s.status}</span>
                </li>`
            ).join('');

            document.getElementById('daftar-guru-temp').innerHTML = tempGuru.map((g) => 
                `<li class="list-group-item small py-2">
                    <b>${g.nama}</b> <br>
                    <small class="text-muted">${g.jam} | Masuk: <b>${g.waktuMasuk || '-'} WIB</b></small> 
                    <span class="badge bg-secondary ms-1">${g.status}</span><br>
                    <i class="text-muted">Catatan: ${g.tugas || '-'}</i>
                </li>`
            ).join('');
        }

        // SIMPAN DRAF LOKAL (OFFLINE)
        function simpanLokal() {
            const petugas = document.getElementById('nama-petugas').value;
            const tanggal = document.getElementById('tgl-piket').value;
            if(!petugas) return alert("Isi nama Petugas Piket terlebih dahulu!");

            const laporan = { petugas, tanggal, siswaList: tempSiswa, guruList: tempGuru };
            localStorage.setItem('draf_laporan_piket', JSON.stringify(laporan));
            alert("Laporan berhasil disimpan sementara di HP!");
        }

        // UPLOAD KE PUSAT (ONLINE)
        async function uploadKePusat() {
            if (!navigator.onLine) return alert("Tidak ada internet! Aktifkan internet untuk upload.");

            const rawData = localStorage.getItem('draf_laporan_piket');
            const dataToSend = rawData ? JSON.parse(rawData) : {
                petugas: document.getElementById('nama-petugas').value,
                tanggal: document.getElementById('tgl-piket').value,
                siswaList: tempSiswa,
                guruList: tempGuru
            };

            if(!dataToSend.petugas) return alert("Nama petugas belum diisi!");
            if(dataToSend.siswaList.length === 0 && dataToSend.guruList.length === 0) {
                return alert("Tidak ada data untuk di-upload!");
            }

            try {
                const response = await fetch(SCRIPT_URL, {
                    method: 'POST',
                    body: JSON.stringify(dataToSend)
                });

                const res = await response.json();
                if(res.status === 'success') {
                    alert("ALHAMDULILLAH! Laporan berhasil di-upload!");
                    localStorage.removeItem('draf_laporan_piket');
                    tempSiswa = []; tempGuru = [];
                    renderTempList();
                }
            } catch (err) {
                alert("Gagal meng-upload data.");
            }
        }

        updateStatusKoneksi();
        loadDatalist();
    </script>
</body>
</html>
