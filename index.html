<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>E-Absensi & Jurnal Piket</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-slate-100 text-slate-800 font-sans min-h-screen pb-10">

  <!-- Header Sticky (Tetap Di Atas Saat Scroll) -->
  <header class="sticky top-0 z-50 bg-white/95 backdrop-blur-md border-b border-slate-200 shadow-sm px-4 py-2.5">
    <div class="max-w-3xl mx-auto flex justify-between items-center mb-2">
      <div>
        <h1 class="font-bold text-sm text-indigo-900 flex items-center gap-2">
          <i class="fa-solid fa-clipboard-user text-indigo-600"></i> E-ABSENSI PIKET
        </h1>
        <p id="clockDisplay" class="text-[11px] font-medium text-slate-500">Memuat waktu...</p>
      </div>
      <span id="statusKoneksi" class="px-2.5 py-1 text-[10px] rounded-full bg-emerald-500 text-white font-semibold flex items-center gap-1 shadow-sm">
        <i class="fa-solid fa-wifi"></i> Online
      </span>
    </div>

    <!-- Navigasi Tab Sticky -->
    <div class="max-w-3xl mx-auto flex bg-slate-100 p-1 rounded-xl gap-1 border border-slate-200">
      <button type="button" id="tabBtnGuru" onclick="switchTab(event, 'guru')" class="flex-1 py-2 text-center font-semibold text-xs rounded-lg transition-all bg-indigo-600 text-white shadow">
        <i class="fa-solid fa-chalkboard-user mr-1"></i> Izin Guru
      </button>
      <button type="button" id="tabBtnSiswa" onclick="switchTab(event, 'siswa')" class="flex-1 py-2 text-center font-semibold text-xs rounded-lg text-slate-600 hover:bg-slate-200 transition-all">
        <i class="fa-solid fa-user-graduate mr-1"></i> Izin Siswa
      </button>
      <button type="button" id="tabBtnPantau" onclick="switchTab(event, 'pantau')" class="flex-1 py-2 text-center font-semibold text-xs rounded-lg text-slate-600 hover:bg-slate-200 transition-all">
        <i class="fa-solid fa-chart-line mr-1"></i> Pantau
      </button>
    </div>
  </header>

  <main class="max-w-3xl mx-auto p-4 space-y-4">

    <!-- Panel Catatan Offline (Di Atas Status/Form, Minimize & Edit/Hapus Selektif) -->
    <div id="panelOffline" class="bg-amber-50 border border-amber-200 rounded-xl shadow-sm overflow-hidden hidden">
      <div class="p-3 bg-amber-100/80 flex justify-between items-center border-b border-amber-200 cursor-pointer" onclick="toggleOfflinePanel()">
        <div class="flex items-center gap-2">
          <span class="w-6 h-6 bg-amber-500 text-white rounded-lg flex items-center justify-center text-xs font-bold">
            <i class="fa-solid fa-box-archive"></i>
          </span>
          <h3 class="font-bold text-xs text-amber-900">Catatan Tersimpan Offline (<span id="offlineCount">0</span>)</h3>
        </div>
        <div class="flex items-center gap-2">
          <button type="button" onclick="syncOfflineData(event)" class="px-2.5 py-1 bg-amber-600 hover:bg-amber-700 text-white rounded-lg text-[11px] font-semibold transition-all shadow-sm">
            <i class="fa-solid fa-cloud-arrow-up mr-1"></i> Upload Semua
          </button>
          <button type="button" class="text-amber-700 hover:text-amber-900 p-1">
            <i id="iconMinimize" class="fa-solid fa-chevron-up text-xs transition-transform duration-200"></i>
          </button>
        </div>
      </div>
      
      <div id="offlineBody" class="p-3 space-y-2 max-h-60 overflow-y-auto">
        <!-- Render Item Offline -->
      </div>
    </div>

    <!-- Input Nama Petugas Piket -->
    <div class="bg-white p-3.5 rounded-xl border border-slate-200 shadow-sm">
      <label class="block text-xs font-semibold text-slate-700 mb-1">
        <i class="fa-solid fa-user-shield text-indigo-600 mr-1"></i> Nama Petugas Piket:
      </label>
      <input type="text" id="petugasPiket" placeholder="Masukkan nama petugas piket hari ini..." class="w-full text-xs p-2.5 rounded-lg border border-slate-300 focus:outline-none focus:ring-2 focus:ring-indigo-500 font-medium">
    </div>

    <!-- Form Izin Guru -->
    <form id="formGuru" onsubmit="handleSubmitedGuru(event)" class="bg-white p-4 rounded-xl border border-slate-200 shadow-sm space-y-3">
      <h2 class="font-bold text-xs text-slate-800 border-b pb-2 flex items-center justify-between">
        <span class="flex items-center gap-1.5"><i class="fa-solid fa-pen-to-square text-indigo-600"></i> Form Laporan Kehadiran Guru</span>
        <span id="statusLoadGuru" class="text-[10px] text-slate-400 font-normal">Memuat data guru...</span>
      </h2>
      
      <div>
        <label class="block text-xs font-medium text-slate-600 mb-1">Nama Guru</label>
        <select id="selectGuru" onchange="onGuruSelectChanged()" class="w-full text-xs p-2.5 rounded-lg border border-slate-300 focus:ring-2 focus:ring-indigo-500 font-medium">
          <option value="">-- Memuat List Guru... --</option>
        </select>
      </div>

      <div>
        <label class="block text-xs font-medium text-slate-600 mb-1">Mata Pelajaran (Otomatis Sesuai Guru)</label>
        <select id="selectGuruMapel" class="w-full text-xs p-2.5 rounded-lg border border-slate-300 focus:ring-2 focus:ring-indigo-500 font-medium">
          <option value="">-- Pilih Guru Terlebih Dahulu --</option>
        </select>
      </div>

      <div class="grid grid-cols-2 gap-3">
        <div>
          <label class="block text-xs font-medium text-slate-600 mb-1">Jam Ke-</label>
          <select id="guruJamKe" class="w-full text-xs p-2.5 rounded-lg border border-slate-300 focus:ring-2 focus:ring-indigo-500 font-medium">
            <!-- Pilihan Jam Ke 1 s/d 12 -->
          </select>
        </div>
        <div>
          <label class="block text-xs font-medium text-slate-600 mb-1">Jam Masuk</label>
          <input type="time" id="guruJamMasuk" class="w-full text-xs p-2.5 rounded-lg border border-slate-300 focus:ring-2 focus:ring-indigo-500 font-medium">
        </div>
      </div>

      <div>
        <label class="block text-xs font-medium text-slate-600 mb-1">Status Kehadiran</label>
        <select id="guruStatus" class="w-full text-xs p-2.5 rounded-lg border border-slate-300 focus:ring-2 focus:ring-indigo-500 font-medium">
          <option value="Hadir">Hadir</option>
          <option value="Izin">Izin</option>
          <option value="Sakit">Sakit</option>
          <option value="Tugas Luar">Tugas Luar</option>
          <option value="Tanpa Keterangan">Tanpa Keterangan</option>
        </select>
      </div>

      <div>
        <label class="block text-xs font-medium text-slate-600 mb-1">Tugas / Catatan Materi</label>
        <textarea id="guruTugas" rows="2" placeholder="Catatan tugas / instruksi kelas..." class="w-full text-xs p-2.5 rounded-lg border border-slate-300 focus:ring-2 focus:ring-indigo-500 font-medium"></textarea>
      </div>

      <div class="flex gap-2 pt-2">
        <button type="button" onclick="simpanGuruOffline()" class="flex-1 py-2.5 bg-amber-500 hover:bg-amber-600 text-white font-semibold text-xs rounded-lg shadow transition-all">
          <i class="fa-solid fa-floppy-disk mr-1"></i> Simpan Offline
        </button>
        <button type="submit" class="flex-1 py-2.5 bg-indigo-600 hover:bg-indigo-700 text-white font-semibold text-xs rounded-lg shadow transition-all">
          <i class="fa-solid fa-paper-plane mr-1"></i> Upload Langsung
        </button>
      </div>
    </form>

    <!-- Form Izin Siswa -->
    <form id="formSiswa" onsubmit="handleSubmitedSiswa(event)" class="bg-white p-4 rounded-xl border border-slate-200 shadow-sm space-y-3 hidden">
      <h2 class="font-bold text-xs text-slate-800 border-b pb-2 flex items-center justify-between">
        <span class="flex items-center gap-1.5"><i class="fa-solid fa-pen-to-square text-emerald-600"></i> Form Laporan Izin Siswa</span>
        <span id="statusLoadSiswa" class="text-[10px] text-slate-400 font-normal">Memuat data siswa...</span>
      </h2>

      <div>
        <label class="block text-xs font-medium text-slate-600 mb-1">Nama Siswa & Kelas</label>
        <select id="selectSiswa" class="w-full text-xs p-2.5 rounded-lg border border-slate-300 focus:ring-2 focus:ring-emerald-500 font-medium">
          <option value="">-- Memuat List Siswa... --</option>
        </select>
      </div>

      <div>
        <label class="block text-xs font-medium text-slate-600 mb-1">Jam Ke-</label>
        <select id="siswaJamKe" class="w-full text-xs p-2.5 rounded-lg border border-slate-300 focus:ring-2 focus:ring-emerald-500 font-medium">
          <!-- Pilihan Jam Ke 1 s/d 12 -->
        </select>
      </div>

      <div>
        <label class="block text-xs font-medium text-slate-600 mb-1">Keterangan / Alasan</label>
        <select id="siswaStatus" class="w-full text-xs p-2.5 rounded-lg border border-slate-300 focus:ring-2 focus:ring-emerald-500 font-medium">
          <option value="Izin Pulang">Izin Pulang</option>
          <option value="Izin Keluar">Izin Keluar</option>
          <option value="Sakit UKS">Sakit di UKS</option>
          <option value="Terlambat">Terlambat</option>
          <option value="Tanpa Keterangan">Tanpa Keterangan</option>
        </select>
      </div>

      <div class="flex gap-2 pt-2">
        <button type="button" onclick="simpanSiswaOffline()" class="flex-1 py-2.5 bg-amber-500 hover:bg-amber-600 text-white font-semibold text-xs rounded-lg shadow transition-all">
          <i class="fa-solid fa-floppy-disk mr-1"></i> Simpan Offline
        </button>
        <button type="submit" class="flex-1 py-2.5 bg-emerald-600 hover:bg-emerald-700 text-white font-semibold text-xs rounded-lg shadow transition-all">
          <i class="fa-solid fa-paper-plane mr-1"></i> Upload Langsung
        </button>
      </div>
    </form>

    <!-- Tab Pantau -->
    <div id="sectionPantau" class="space-y-4 hidden">
      <div id="tabelLaporanContainer"></div>
    </div>

  </main>

  <script src="app.js"></script>
</body>
</html>
