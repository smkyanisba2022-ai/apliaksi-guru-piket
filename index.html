<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>E-Absensi & Jurnal Piket</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-slate-100 text-slate-800 font-sans min-h-screen">

  <!-- Header Ringkas & Sticky Navigation -->
  <header class="sticky top-0 z-50 bg-white/95 backdrop-blur-md border-b border-slate-200 shadow-sm px-4 py-2.5">
    <div class="max-w-3xl mx-auto flex justify-between items-center mb-2">
      <h1 class="font-bold text-sm text-indigo-900 flex items-center gap-2">
        <i class="fa-solid fa-clipboard-user text-indigo-600"></i> E-Absensi Piket
      </h1>
      <span id="statusKoneksi" class="px-2.5 py-0.5 text-[11px] rounded-full bg-emerald-500 text-white font-medium">Online</span>
    </div>

    <!-- Navigasi Tab (Sticky & Selalu Di Atas saat Scroll) -->
    <div class="max-w-3xl mx-auto flex bg-slate-100 p-1 rounded-xl gap-1 border border-slate-200">
      <button type="button" id="tabBtnGuru" onclick="switchTab(event, 'guru')" class="flex-1 py-2 text-center font-semibold text-xs rounded-lg transition-all bg-indigo-600 text-white shadow">
        <i class="fa-solid fa-chalkboard-user mr-1"></i> Izin Guru
      </button>
      <button type="button" id="tabBtnSiswa" onclick="switchTab(event, 'siswa')" class="flex-1 py-2 text-center font-semibold text-xs rounded-lg text-slate-600 hover:bg-slate-200 transition-all">
        <i class="fa-solid fa-user-graduate mr-1"></i> Izin Siswa
      </button>
      <button type="button" id="tabBtnPantau" onclick="switchTab(event, 'pantau')" class="flex-1 py-2 text-center font-semibold text-xs rounded-lg text-slate-600 hover:bg-slate-200 transition-all">
        <i class="fa-solid fa-chart-line mr-1"></i> Pantau
      </button>
    </div>
  </header>

  <!-- Konten Utama -->
  <main class="max-w-3xl mx-auto p-4">
    
    <!-- Input Petugas Piket (Selalu Tampak) -->
    <div class="bg-white p-3.5 rounded-xl border border-slate-200 shadow-sm mb-4">
      <label class="block text-xs font-semibold text-slate-700 mb-1">
        <i class="fa-solid fa-user-shield text-indigo-600 mr-1"></i> Nama Petugas Piket:
      </label>
      <input type="text" id="petugasPiket" placeholder="Masukkan nama petugas piket hari ini..." class="w-full text-xs p-2.5 rounded-lg border border-slate-300 focus:outline-none focus:ring-2 focus:ring-indigo-500 font-medium">
    </div>

    <!-- Form Izin Guru -->
    <form id="formGuru" onsubmit="handleSubmitedGuru(event)" class="bg-white p-4 rounded-xl border border-slate-200 shadow-sm space-y-3">
      <h2 class="font-bold text-xs text-slate-800 border-b pb-2">Form Laporan Kehadiran Guru</h2>
      <div>
        <label class="block text-xs font-medium text-slate-600 mb-1">Nama Guru</label>
        <select id="selectGuru" onchange="onGuruSelectChanged()" class="w-full text-xs p-2.5 rounded-lg border border-slate-300 focus:ring-2 focus:ring-indigo-500">
          <option value="">-- Pilih Nama Guru --</option>
        </select>
      </div>
      <div>
        <label class="block text-xs font-medium text-slate-600 mb-1">Mata Pelajaran</label>
        <select id="selectGuruMapel" class="w-full text-xs p-2.5 rounded-lg border border-slate-300 focus:ring-2 focus:ring-indigo-500">
          <option value="">-- Pilih Guru Terlebih Dahulu --</option>
        </select>
      </div>
      <div class="grid grid-cols-2 gap-3">
        <div>
          <label class="block text-xs font-medium text-slate-600 mb-1">Jam Ke</label>
          <input type="text" id="guruJamKe" placeholder="Misal: 1-2" class="w-full text-xs p-2.5 rounded-lg border border-slate-300">
        </div>
        <div>
          <label class="block text-xs font-medium text-slate-600 mb-1">Jam Masuk</label>
          <input type="time" id="guruJamMasuk" class="w-full text-xs p-2.5 rounded-lg border border-slate-300">
        </div>
      </div>
      <div>
        <label class="block text-xs font-medium text-slate-600 mb-1">Status Kehadiran</label>
        <select id="guruStatus" class="w-full text-xs p-2.5 rounded-lg border border-slate-300">
          <option value="Hadir">Hadir</option>
          <option value="Izin">Izin</option>
          <option value="Sakit">Sakit</option>
          <option value="Tugas Luar">Tugas Luar</option>
          <option value="Tanpa Keterangan">Tanpa Keterangan</option>
        </select>
      </div>
      <div>
        <label class="block text-xs font-medium text-slate-600 mb-1">Tugas / Catatan Materi</label>
        <textarea id="guruTugas" rows="2" placeholder="Catatan tugas atau instruksi..." class="w-full text-xs p-2.5 rounded-lg border border-slate-300"></textarea>
      </div>
      <button type="submit" class="w-full py-2.5 bg-indigo-600 hover:bg-indigo-700 text-white font-semibold text-xs rounded-lg shadow transition-all cursor-pointer">
        <i class="fa-solid fa-paper-plane mr-1"></i> Simpan Laporan Guru
      </button>
    </form>

    <!-- Form Izin Siswa -->
    <form id="formSiswa" onsubmit="handleSubmitedSiswa(event)" class="bg-white p-4 rounded-xl border border-slate-200 shadow-sm space-y-3 hidden">
      <h2 class="font-bold text-xs text-slate-800 border-b pb-2">Form Laporan Izin Siswa</h2>
      <div>
        <label class="block text-xs font-medium text-slate-600 mb-1">Nama Siswa</label>
        <select id="selectSiswa" class="w-full text-xs p-2.5 rounded-lg border border-slate-300 focus:ring-2 focus:ring-indigo-500">
          <option value="">-- Pilih Nama Siswa --</option>
        </select>
      </div>
      <div>
        <label class="block text-xs font-medium text-slate-600 mb-1">Jam Ke</label>
        <input type="text" id="siswaJamKe" placeholder="Misal: 3-4" class="w-full text-xs p-2.5 rounded-lg border border-slate-300">
      </div>
      <div>
        <label class="block text-xs font-medium text-slate-600 mb-1">Keterangan / Alasan</label>
        <select id="siswaStatus" class="w-full text-xs p-2.5 rounded-lg border border-slate-300">
          <option value="Izin Pulang">Izin Pulang</option>
          <option value="Izin Keluar">Izin Keluar</option>
          <option value="Sakit UKS">Sakit di UKS</option>
          <option value="Terlambat">Terlambat</option>
        </select>
      </div>
      <button type="submit" class="w-full py-2.5 bg-emerald-600 hover:bg-emerald-700 text-white font-semibold text-xs rounded-lg shadow transition-all cursor-pointer">
        <i class="fa-solid fa-paper-plane mr-1"></i> Simpan Laporan Siswa
      </button>
    </form>

    <!-- Section Pantau Laporan -->
    <div id="sectionPantau" class="space-y-4 hidden">
      <div id="tabelLaporanContainer"></div>
    </div>

  </main>

  <script src="app.js"></script>
</body>
</html>
