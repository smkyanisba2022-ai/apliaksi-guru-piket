<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Aplikasi Guru Piket</title>
  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body { background-color: #f4f6f9; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    .card { border-radius: 12px; border: none; }
    .status-badge { font-size: 0.85rem; padding: 5px 10px; border-radius: 20px; }
    .badge-delete { cursor: pointer; }
  </style>
</head>
<body class="pb-5">

  <nav class="navbar navbar-dark bg-dark mb-3">
    <div class="container-fluid">
      <span class="navbar-brand mb-0 h1">E-PIKET SMK YANISBA</span>
      <div>
        <span id="statusJaringan" class="badge status-badge bg-secondary me-2">Memeriksa...</span>
        <button class="btn btn-outline-light btn-sm" onclick="syncMasterData()">🔄 Sync Master</button>
      </div>
    </div>
  </nav>

  <div class="container" style="max-width: 600px;">

    <!-- TANGGAL & NAMA PETUGAS -->
    <div class="card p-3 mb-3 shadow-sm">
      <div class="mb-2">
        <label class="form-label fw-bold">Tanggal Piket:</label>
        <input type="date" id="tglPiket" class="form-control" onchange="simpanDrafLokal()">
      </div>
      <div>
        <label class="form-label fw-bold">Nama Petugas Piket:</label>
        <input type="text" id="namaPetugas" class="form-control" placeholder="Ketik nama Anda..." oninput="simpanDrafLokal()">
      </div>
    </div>

    <!-- 1. CATAT SISWA BERMASALAH / ABSEN -->
    <div class="card p-3 mb-3 shadow-sm">
      <h5 class="text-primary fw-bold">1. Catat Siswa Bermasalah / Absen</h5>
      
      <div class="mb-2">
        <label class="form-label">Cari Nama Siswa:</label>
        <input type="text" id="inputSiswa" class="form-control" list="datalistSiswa" placeholder="Ketik nama / kelas siswa...">
        <datalist id="datalistSiswa"></datalist>
      </div>

      <div class="row">
        <div class="col-6 mb-2">
          <label class="form-label">Jam Ke-:</label>
          <select id="jamSiswa" class="form-control">
            <option value="Jam ke 1-2">Jam ke 1-2</option>
            <option value="Jam ke 3-4">Jam ke 3-4</option>
            <option value="Jam ke 5-6">Jam ke 5-6</option>
            <option value="Jam ke 7-8">Jam ke 7-8</option>
            <option value="Seharian">Seharian</option>
          </select>
        </div>
        <div class="col-6 mb-2">
          <label class="form-label">Keterangan Status:</label>
          <select id="statusSiswa" class="form-control">
            <option value="Alpa (Tanpa Keterangan)">Alpa (Tanpa Keterangan)</option>
            <option value="Izin">Izin</option>
            <option value="Sakit">Sakit</option>
            <option value="Terlambat">Terlambat</option>
            <option value="Cabut / Membolos">Cabut / Membolos</option>
          </select>
        </div>
      </div>

      <button type="button" class="btn btn-primary w-100" onclick="tambahSiswa()">+ Tambah Siswa</button>

      <!-- DAFTAR SEMENTARA SISWA -->
      <ul class="list-group mt-3" id="listSiswaTampil"></ul>
    </div>

    <!-- 2. CATAT GURU TIDAK HADIR -->
    <div class="card p-3 mb-3 shadow-sm">
      <h5 class="text-danger fw-bold">2. Catat Guru Tidak Hadir / Tugas</h5>
      
      <!-- Cari Nama Guru -->
      <div class="mb-2">
        <label class="form-label">Cari Nama Guru:</label>
        <input type="text" id="inputGuru" class="form-control" list="datalistGuru" oninput="onGuruSelected()" placeholder="Ketik nama guru...">
        <datalist id="datalistGuru"></datalist>
      </div>

      <!-- Dropdown Mapel Dinamis -->
      <div class="mb-2">
        <label class="form-label">Pilih Mata Pelajaran:</label>
        <select id="selectMapelGuru" class="form-control">
          <option value="">-- Pilih Mapel --</option>
        </select>
      </div>

      <div class="row">
        <div class="col-6 mb-2">
          <label class="form-label">Jam Ke-:</label>
          <select id="jamGuru" class="form-control">
            <option value="Jam ke 1-2">Jam ke 1-2</option>
            <option value="Jam ke 3-4">Jam ke 3-4</option>
            <option value="Jam ke 5-6">Jam ke 5-6</option>
            <option value="Jam ke 7-8">Jam ke 7-8</option>
            <option value="Seharian">Seharian</option>
          </select>
        </div>
        <div class="col-6 mb-2">
          <label class="form-label">Jam Masuk (Manual):</label>
          <input type="time" id="jamMasukGuru" class="form-control">
        </div>
      </div>

      <div class="mb-2">
        <label class="form-label">Keterangan Status:</label>
        <select id="statusGuru" class="form-control">
          <option value="Izin">Izin</option>
          <option value="Sakit">Sakit</option>
          <option value="Alpa">Alpa</option>
          <option value="Terlambat">Terlambat</option>
          <option value="Tugas Luar">Tugas Luar</option>
        </select>
      </div>

      <div class="mb-2">
        <label class="form-label">Materi & Tugas yang Ditinggalkan:</label>
        <textarea id="tugasGuru" class="form-control" rows="2" placeholder="Contoh: LKS Halaman 12 Bab 2..."></textarea>
      </div>

      <button type="button" class="btn btn-danger w-100" onclick="tambahGuru()">+ Tambah Guru</button>

      <!-- DAFTAR SEMENTARA GURU -->
      <ul class="list-group mt-3" id="listGuruTampil"></ul>
    </div>

    <!-- TOMBOL SUBMIT LAPORAN -->
    <button class="btn btn-success btn-lg w-100 shadow mb-3" onclick="kirimLaporan()">🚀 UPLOAD LAPORAN KE PUSAT</button>

  </div>

  <script>
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxR_LxFxTgDvxF_f3ahzFxCsvsLkhDKvnMXhpYThks6tOVCHxxtx-q3NsqmluRYIhK2/exec";

    let masterSiswa = [];
    let masterGuru = [];
    let siswaList = [];
    let guruList = [];

    // Inisialisasi & Cek Status Online/Offline
    window.addEventListener('online', updateStatusKoneksi);
    window.addEventListener('offline', updateStatusKoneksi);

    window.onload = function() {
      updateStatusKoneksi();
      document.getElementById('tglPiket').valueAsDate = new Date();
      
      // Muat Master Data dari LocalStorage
      const localSiswa = localStorage.getItem('masterSiswa');
      const localGuru = localStorage.getItem('masterGuru');

      if (localSiswa && localGuru) {
        masterSiswa = JSON.parse(localSiswa);
        masterGuru = JSON.parse(localGuru);
        populateDatalists();
      } else if (navigator.onLine) {
        syncMasterData();
      }

      // Muat Draf Laporan Lokal jika ada
      muatDrafLokal();
    };

    function updateStatusKoneksi() {
      const badge = document.getElementById('statusJaringan');
      if (navigator.onLine) {
        badge.className = "badge status-badge bg-success me-2";
        badge.innerText = "ONLINE";
      } else {
        badge.className = "badge status-badge bg-danger me-2";
        badge.innerText = "OFFLINE (Simpan Lokal)";
      }
    }

    function syncMasterData() {
      if (!navigator.onLine) {
        alert("Anda sedang Offline. Tidak dapat memperbarui Master Data.");
        return;
      }

      fetch(`${SCRIPT_URL}?action=get_master`)
        .then(res => res.json())
        .then(data => {
          if (data.status === 'success') {
            masterSiswa = data.siswa;
            masterGuru = data.guru;
            localStorage.setItem('masterSiswa', JSON.stringify(masterSiswa));
            localStorage.setItem('masterGuru', JSON.stringify(masterGuru));
            populateDatalists();
            alert('Master Data berhasil diperbarui!');
          }
        })
        .catch(err => alert('Gagal mengambil Master Data. Cek koneksi internet!'));
    }

    function populateDatalists() {
      const dlSiswa = document.getElementById('datalistSiswa');
      const dlGuru = document.getElementById('datalistGuru');
      dlSiswa.innerHTML = '';
      dlGuru.innerHTML = '';

      masterSiswa.forEach(s => {
        const opt = document.createElement('option');
        opt.value = `${s.nama} (${s.kelas})`;
        dlSiswa.appendChild(opt);
      });

      masterGuru.forEach(g => {
        const opt = document.createElement('option');
        opt.value = g.nama;
        dlGuru.appendChild(opt);
      });
    }

    function onGuruSelected() {
      const inputNama = document.getElementById('inputGuru').value.trim();
      const selectMapel = document.getElementById('selectMapelGuru');
      selectMapel.innerHTML = '<option value="">-- Pilih Mapel --</option>';

      if (!inputNama) return;

      const guruFound = masterGuru.find(g => g.nama.toLowerCase() === inputNama.toLowerCase());

      if (guruFound && guruFound.mapel) {
        const listMapel = guruFound.mapel.split(',');
        listMapel.forEach(mapelText => {
          const m = mapelText.trim();
          if (m) {
            const opt = document.createElement('option');
            opt.value = m;
            opt.textContent = m;
            selectMapel.appendChild(opt);
          }
        });

        if (listMapel.length === 1) {
          selectMapel.selectedIndex = 1;
        }
      }
    }

    function tambahSiswa() {
      const nama = document.getElementById('inputSiswa').value.trim();
      const jam = document.getElementById('jamSiswa').value;
      const status = document.getElementById('statusSiswa').value;

      if (!nama) { alert('Pilih nama siswa terlebih dahulu!'); return; }

      siswaList.push({ nama, jam, status });
      renderSiswa();
      simpanDrafLokal();
      document.getElementById('inputSiswa').value = '';
    }

    function renderSiswa() {
      const ul = document.getElementById('listSiswaTampil');
      ul.innerHTML = '';
      siswaList.forEach((s, idx) => {
        ul.innerHTML += `
          <li class="list-group-item d-flex justify-content-between align-items-center">
            <div><strong>${s.nama}</strong><br><small class="text-muted">${s.jam} | ${s.status}</small></div>
            <span class="badge bg-danger rounded-pill badge-delete" onclick="hapusSiswa(${idx})">X</span>
          </li>`;
      });
    }

    function hapusSiswa(idx) {
      siswaList.splice(idx, 1);
      renderSiswa();
      simpanDrafLokal();
    }

    function tambahGuru() {
      const namaGuru = document.getElementById('inputGuru').value.trim();
      const mapelGuru = document.getElementById('selectMapelGuru').value;
      const jamKe = document.getElementById('jamGuru').value;
      const jamMasuk = document.getElementById('jamMasukGuru').value;
      const status = document.getElementById('statusGuru').value;
      const tugas = document.getElementById('tugasGuru').value;

      if (!namaGuru) { alert('Ketik atau pilih nama guru terlebih dahulu!'); return; }

      let namaTampil = mapelGuru ? `${namaGuru} - ${mapelGuru}` : namaGuru;

      guruList.push({
        nama: namaTampil,
        jam: jamKe,
        waktuMasuk: jamMasuk || '-',
        status: status,
        tugas: tugas || '-'
      });

      renderGuru();
      simpanDrafLokal();

      document.getElementById('inputGuru').value = '';
      document.getElementById('selectMapelGuru').innerHTML = '<option value="">-- Pilih Mapel --</option>';
      document.getElementById('tugasGuru').value = '';
      document.getElementById('jamMasukGuru').value = '';
    }

    function renderGuru() {
      const ul = document.getElementById('listGuruTampil');
      ul.innerHTML = '';
      guruList.forEach((g, idx) => {
        ul.innerHTML += `
          <li class="list-group-item d-flex justify-content-between align-items-center">
            <div>
              <strong>${g.nama}</strong><br>
              <small class="text-muted">${g.jam} | Masuk: ${g.waktuMasuk} | ${g.status}</small><br>
              <small class="text-secondary">Tugas: ${g.tugas}</small>
            </div>
            <span class="badge bg-danger rounded-pill badge-delete" onclick="hapusGuru(${idx})">X</span>
          </li>`;
      });
    }

    function hapusGuru(idx) {
      guruList.splice(idx, 1);
      renderGuru();
      simpanDrafLokal();
    }

    // PENYIMPANAN LOKAL (OFFLINE FIRST)
    function simpanDrafLokal() {
      const draf = {
        tanggal: document.getElementById('tglPiket').value,
        petugas: document.getElementById('namaPetugas').value,
        siswaList: siswaList,
        guruList: guruList
      };
      localStorage.setItem('drafPiket', JSON.stringify(draf));
    }

    function muatDrafLokal() {
      const drafRaw = localStorage.getItem('drafPiket');
      if (drafRaw) {
        const draf = JSON.parse(drafRaw);
        if (draf.tanggal) document.getElementById('tglPiket').value = draf.tanggal;
        if (draf.petugas) document.getElementById('namaPetugas').value = draf.petugas;
        siswaList = draf.siswaList || [];
        guruList = draf.guruList || [];
        renderSiswa();
        renderGuru();
      }
    }

    function bersihkanDrafLokal() {
      localStorage.removeItem('drafPiket');
      siswaList = [];
      guruList = [];
      renderSiswa();
      renderGuru();
    }

    function kirimLaporan() {
      const tglRaw = document.getElementById('tglPiket').value;
      const petugas = document.getElementById('namaPetugas').value.trim();

      if (!petugas) { alert('Isi Nama Petugas Piket terlebih dahulu!'); return; }

      if (!navigator.onLine) {
        alert('Status HP sedang OFFLINE. Data sudah tersimpan di memori HP. Silakan tekan tombol Upload saat koneksi internet kembali ONLINE!');
        return;
      }

      const parts = tglRaw.split('-');
      const tglFormatted = `${parts[2]}/${parts[1]}/${parts[0]}`;

      const payload = {
        tanggal: tglFormatted,
        petugas: petugas,
        siswaList: siswaList,
        guruList: guruList
      };

      if (!confirm('Apakah Anda yakin ingin mengirim laporan harian ini ke Pusat?')) return;

      fetch(SCRIPT_URL, {
        method: 'POST',
        body: JSON.stringify(payload)
      })
      .then(res => res.json())
      .then(res => {
        if (res.status === 'success') {
          alert(' Laporan Berhasil Dikirim!');
          bersihkanDrafLokal();
        } else {
          alert('Gagal mengirim: ' + res.message);
        }
      })
      .catch(err => alert('Terjadi kesalahan koneksi saat mengirim data. Laporan Anda tetap tersimpan di draf lokal.'));
    }
  </script>
</body>
</html>
